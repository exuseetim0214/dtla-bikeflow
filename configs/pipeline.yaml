project:
  name: dtla-bikeflow
  timezone: America/Los_Angeles

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifact_dir: artifacts

data:
  region: DTLA
  virtual_station_ids: [3000]
  time_bin: 30min
  panel_presence: observed_bounds
  output_format: parquet

features:
  demand_lags: [1, 2, 3, 48, 336, 672, 1008, 1344]
  rolling_windows: [2, 6, 48, 336]
  neighbor_count: 5
  neighbor_radius_meters: 1000

targets:
  demand_horizons_bins: [1, 2]
  status_confirmation_snapshots: 2

split:
  train_start: "2024-04-01"
  train_end: "2025-12-31 23:59:59"
  validation_start: "2026-01-01"
  validation_end: "2026-03-31 23:59:59"
  test_start: "2026-04-01"
  test_end: "2026-06-30 23:59:59"
